name: Build RPG Launcher for Windows
on:
  workflow_dispatch:
  push:
    branches: [rpg]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-dev.txt
      - name: Check and build RPG Launcher
        shell: pwsh
        run: ./scripts/build-rpg.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: EveJS-RPG-Launcher-Windows
          path: |
            dist/EveJS-RPG-Launcher.zip
            dist/EveJS-RPG-Launcher.zip.sha256
          if-no-files-found: error
